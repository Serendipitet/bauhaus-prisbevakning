name: BAUHAUS prisbevakning

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # var sjätte timme (UTC)

permissions:
  contents: write

concurrency:
  group: bauhaus-prisbevakning
  cancel-in-progress: false

jobs:
  price-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut projektet
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kontrollera priser och skicka Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_monitor.py

      - name: Spara status för nästa körning
        if: success()
        run: |
          if ! git diff --quiet -- varning_skickad.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add varning_skickad.json
            git commit -m "Uppdatera prisbevakningens status"
            git push
          fi
